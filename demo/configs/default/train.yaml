# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: spiral
  seed: 0
  # 小さなモデルなので, GPU より CPU の方が速い
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.03

trainer:
  epochs: 40
  monitor: valid/acc
  mode: max

# デモのプロジェクト固有の設定
data:
  # 学習用と検証用の点の数, 渦巻きのノイズの大きさ
  train_size: 600
  valid_size: 200
  noise: 0.1
  batch_size: 64

model:
  hidden_dim: 64
