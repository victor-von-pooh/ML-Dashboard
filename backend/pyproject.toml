[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-dashboard"
version = "0.1.0"
description = "ML-Found の実験の結果を確かめるローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "ml-found",
    "omegaconf>=2.3",
    "pydantic>=2.9",
    # ML-Found が使う. Linux では下の pytorch-cpu から取る
    "torch>=2.2",
    "uvicorn>=0.32"
]

[project.scripts]
ml-dashboard = "ml_dashboard.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8"
]

[tool.uv.sources]
ml-found = { path = "../ML-Found", editable = true }
# Linux (CI) では CUDA の無い軽い PyTorch を使う
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ML-Found に合わせて Optional を使う
ignore = ["UP007", "UP045"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "test_api"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
