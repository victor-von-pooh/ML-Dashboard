# 値段を変える判断 (ML-Quest の値段を変える判断の骨組み) の画面の確かめ用の
# プロジェクト. 学習はせず, 置いた実験を見る. 学習率を変えた 2 つの実験を比べる
experiment:
  name: units_price
  output_dir: outputs
  seed: 0
  device: cpu
optimizer:
  name: AdamW
  params:
    lr: 0.001
trainer:
  epochs: 3
  grad_clip_norm: 1.0
  monitor: valid/mae
  mode: min
data:
  dataset: outputs/dataset
  source: null
  batch_size: 128
price:
  candidates: [-0.1, -0.05, 0, 0.05, 0.1]
  max_change: 0.1
model:
  spec: models/model.yaml
